    <script>
      window.addEventListener('error', function(event) {
        setTimeout(function() {
          var errorDiv = document.createElement('div');
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = 'rgba(0,0,0,0.95)';
          errorDiv.style.color = '#ff6b6b';
          errorDiv.style.padding = '20px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.overflow = 'auto';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.whiteSpace = 'pre-wrap';
          errorDiv.innerHTML = '<h1 style="color:#ff4757;margin-top:0;">حَدَث خطأ في التشغيل (Runtime Error)</h1>' +
            '<strong>الرسالة:</strong> ' + event.message + '<br><br>' +
            '<strong>الملف:</strong> ' + event.filename + ':' + event.lineno + ':' + event.colno + '<br><br>' +
            '<strong>الخطأ كاملًا:</strong><br>' + (event.error ? event.error.stack : 'لا يوجد تفاصيل إضافية');
          if (document.body) {
            document.body.appendChild(errorDiv);
          } else {
            document.documentElement.appendChild(errorDiv);
          }
        }, 100);
      });
      window.addEventListener('unhandledrejection', function(event) {
        setTimeout(function() {
          var errorDiv = document.createElement('div');
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.height = '100%';
          errorDiv.style.backgroundColor = 'rgba(0,0,0,0.95)';
          errorDiv.style.color = '#ff6b6b';
          errorDiv.style.padding = '20px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.overflow = 'auto';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.whiteSpace = 'pre-wrap';
          errorDiv.innerHTML = '<h1 style="color:#ff4757;margin-top:0;">حَدَث خطأ غير معالج (Unhandled Promise Rejection)</h1>' +
            '<strong>السبب:</strong> ' + event.reason + '<br><br>' +
            '<strong>الخطأ كاملًا:</strong><br>' + (event.reason ? (event.reason.stack || event.reason) : 'لا يوجد تفاصيل إضافية');
          if (document.body) {
            document.body.appendChild(errorDiv);
          } else {
            document.documentElement.appendChild(errorDiv);
          }
        }, 100);
      });
    </script>
    <script>
      // Clear legacy Service Worker caches on load
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            if (key !== 'lensflow-cache-v20261003-utf8-v4') {
              console.log('Purging old cache:', key);
              caches.delete(key);
            }
          });
        });
      }

      // Service Worker Registration with Auto-Update and Cache Busting
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=20261003v4').then(registration => {
            console.log('SW registered: ', registration);
            registration.update();
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New version detected, reloading...');
                    window.location.reload();
                  }
                });
              }
            });
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
    <script>
      // Dynamic Manifest for Custom PWA Icon
      try {
        const customIcon = localStorage.getItem('custom_app_icon');
        const defaultManifest = {
          "name": "نظام الحجز | حجز تصوير المناسبات",
          "short_name": "نظام الحجز",
          "description": "إدارة حجوزات التصوير والمناسبات",
          "start_url": "/",
          "display": "standalone",
          "orientation": "portrait-primary",
          "background_color": "#0b0f19",
          "theme_color": "#4338ca",
          "scope": "/",
          "lang": "ar",
          "dir": "rtl",
          "categories": ["business", "productivity", "utilities"],
          "icons": [
            {
              "src": customIcon || "/favicon.svg",
              "sizes": "192x192 512x512 any",
              "type": customIcon ? "image/png" : "image/svg+xml",
              "purpose": "any maskable"
            }
          ]
        };

        const stringManifest = JSON.stringify(defaultManifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        
        const manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
          manifestLink.setAttribute('href', manifestURL);
        }

        if (customIcon) {
          const iconLinks = document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]');
          iconLinks.forEach(link => {
            link.setAttribute('href', customIcon);
            if (link.getAttribute('rel') === 'icon') {
              link.setAttribute('type', 'image/png');
            }
          });
        }
      } catch(e) {
        console.error("Error setting dynamic manifest:", e);
      }
    </script>
